<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كارف .com | الموقع الرسمي ليامن ويوسف</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background-color: #0d0e15;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Particle Canvas Background */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Header Glow Box */
        .glowing-header-box {
            background: linear-gradient(135deg, #ff007f, #7928ca, #00f0ff, #10b981);
            background-size: 300% 300%;
            animation: gradientMove 4s ease infinite;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.4), 0 0 20px rgba(0, 240, 255, 0.4);
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Centered Animated Thumbs Up Emoji */
        .super-animated-thumb-top {
            font-size: 3.8rem;
            display: inline-block;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9));
            animation: floatBounceTop 2s ease-in-out infinite alternate;
            user-select: none;
        }

        @keyframes floatBounceTop {
            0% { transform: translateY(0px) rotate(-8deg) scale(1); }
            50% { transform: translateY(-10px) rotate(8deg) scale(1.15); }
            100% { transform: translateY(-18px) rotate(-4deg) scale(1.05); }
        }

        /* SQUARE Profile Card Containers */
        .square-avatar-container {
            width: 150px;
            height: 150px;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #111827;
        }

        @media (min-width: 640px) {
            .square-avatar-container {
                width: 190px;
                height: 190px;
            }
        }

        /* Youssef Pink Square Neon Glow */
        .youssef-neon-square {
            border: 4px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.85), inset 0 0 20px rgba(255, 0, 127, 0.4);
            animation: pinkNeonPulse 2s ease-in-out infinite alternate;
        }

        @keyframes pinkNeonPulse {
            0% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 10px rgba(255, 0, 127, 0.3); }
            100% { box-shadow: 0 0 40px rgba(255, 0, 127, 1), 0 0 25px rgba(244, 114, 182, 0.9); }
        }

        /* Yamen Cyan Square Neon Glow */
        .yamen-neon-square {
            border: 4px solid #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.85), inset 0 0 20px rgba(0, 240, 255, 0.4);
            animation: cyanNeonPulse 2s ease-in-out infinite alternate;
        }

        @keyframes cyanNeonPulse {
            0% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.6), inset 0 0 10px rgba(0, 240, 255, 0.3); }
            100% { box-shadow: 0 0 40px rgba(0, 240, 255, 1), 0 0 25px rgba(125, 211, 252, 0.9); }
        }

        /* List Glow Box */
        .glowing-list-box {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 0, 127, 0.7);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.35), inset 0 0 20px rgba(121, 40, 202, 0.25);
            animation: listGlowPulse 3s ease-in-out infinite alternate;
        }

        @keyframes listGlowPulse {
            0% { border-color: rgba(255, 0, 127, 0.8); box-shadow: 0 0 20px rgba(255, 0, 127, 0.4); }
            100% { border-color: rgba(0, 240, 255, 0.9); box-shadow: 0 0 30px rgba(0, 240, 255, 0.6); }
        }

        /* Celebration Toast Animation */
        .party-emoji-anim {
            display: inline-block;
            font-size: 3.5rem;
            animation: partyWiggle 0.8s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.8));
        }

        @keyframes partyWiggle {
            0% { transform: scale(1) rotate(-15deg); }
            100% { transform: scale(1.3) rotate(15deg); }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(13, 14, 21, 0.5); }
        ::-webkit-scrollbar-thumb { background: #ff007f; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6 relative selection:bg-pink-500 selection:text-white">

    <!-- Particle Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Ambient Glow Orbs -->
    <div class="fixed top-10 left-1/4 w-80 h-80 bg-pink-600/15 rounded-full blur-3xl pointer-events-none z-0"></div>
    <div class="fixed bottom-10 right-1/4 w-80 h-80 bg-cyan-600/15 rounded-full blur-3xl pointer-events-none z-0"></div>

    <!-- Celebration Modal Toast -->
    <div id="celebrationToast" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 transform scale-90">
        <div class="bg-gradient-to-br from-gray-900 via-slate-900 to-black border-2 border-amber-400/80 rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-[0_0_50px_rgba(251,191,36,0.5)] relative overflow-hidden">
            <div class="relative z-10">
                <div class="party-emoji-anim mb-3">🥳</div>
                <h3 class="text-2xl md:text-3xl font-black text-amber-300 mb-2 tracking-wide">
                    مبروك انت كرفت!
                </h3>
                <p id="karefItemName" class="text-lg md:text-xl font-bold text-pink-400 bg-white/5 border border-pink-500/30 rounded-xl p-3 my-4 break-words shadow-inner">
                    <!-- Dynamic Text -->
                </p>
                <button onclick="closeToast()" class="mt-2 w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-black font-black text-base py-3 px-6 rounded-xl transition-transform active:scale-95 shadow-lg">
                    عاشت الأيادي 🔥
                </button>
            </div>
        </div>
    </div>

    <!-- Header Section -->
    <header class="w-full max-w-3xl text-center mt-2 mb-4 z-10">
        <h1 class="text-4xl md:text-6xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 mb-3 drop-shadow-lg">
            كارف .com 🔥
        </h1>

        <div class="glowing-header-box p-1 rounded-2xl mx-auto max-w-xl">
            <div class="bg-black/90 rounded-xl py-3 px-6 flex items-center justify-center gap-3">
                <span class="text-xl md:text-3xl font-extrabold text-white tracking-wide">
                    الموقع الرسمي ليامن ويوسف
                </span>
                <span class="text-2xl md:text-3xl animate-bounce">⚡</span>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="w-full max-w-2xl flex flex-col items-center z-10">
        
        <div class="relative w-full my-2 flex flex-col items-center">
            
            <!-- Animated Thumbs-Up Emoji Centered DIRECTLY ABOVE the Two Square Cards -->
            <div class="mb-3 text-center z-20">
                <span class="super-animated-thumb-top">👍</span>
            </div>

            <!-- Side-by-Side Square Profile Cards Container -->
            <div class="grid grid-cols-2 gap-4 md:gap-8 items-center justify-items-center w-full max-w-lg">
                
                <!-- Youssef Square Card -->
                <div class="flex flex-col items-center z-10">
                    <div class="square-avatar-container youssef-neon-square mb-3">
                        <img id="youssefImg" src="https://i.ibb.co/spSz6sWY/image.jpg" alt="يوسف" class="w-full h-full object-cover" onerror="handleYoussefImageError(this)">
                    </div>
                    
                    <!-- Youssef Badge -->
                    <div class="w-36 sm:w-44 bg-black/90 border-2 border-pink-500 rounded-full p-1.5 flex items-center justify-between shadow-[0_0_15px_rgba(255,0,127,0.5)]">
                        <span class="text-white font-black text-sm sm:text-base pr-3">يوسف</span>
                        <div class="bg-[#ff007f] text-white font-black px-2.5 py-1 rounded-full text-xs flex flex-col items-center justify-center leading-tight shadow-md">
                            <span>13</span>
                            <span class="text-[9px] leading-none">سنة</span>
                        </div>
                    </div>
                </div>

                <!-- Yamen Square Card -->
                <div class="flex flex-col items-center z-10">
                    <div class="square-avatar-container yamen-neon-square mb-3">
                        <img id="yamenImg" src="https://i.ibb.co/TB3pJSpZ/image.jpg" alt="يامن" class="w-full h-full object-cover" onerror="handleYamenImageError(this)">
                    </div>

                    <!-- Yamen Badge -->
                    <div class="w-36 sm:w-44 bg-black/90 border-2 border-cyan-400 rounded-full p-1.5 flex items-center justify-between shadow-[0_0_15px_rgba(0,240,255,0.5)]">
                        <span class="text-white font-black text-sm sm:text-base pr-3">يامن</span>
                        <div class="bg-[#00f0ff] text-black font-black px-2.5 py-1 rounded-full text-xs flex flex-col items-center justify-center leading-tight shadow-md">
                            <span>13</span>
                            <span class="text-[9px] leading-none">سنة</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Slogan Section -->
        <div class="my-5 text-center space-y-2 w-full">
            <h2 class="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-400 to-pink-500 drop-shadow-md">
                🔥 "اكرف لاي حاجه مش على هواك" 🔥
            </h2>

            <p class="text-lg md:text-2xl font-extrabold text-cyan-300">
                خليك دايما كارف 👍
            </p>
        </div>

        <!-- Interactive Karef List Container -->
        <section class="w-full glowing-list-box rounded-3xl p-5 md:p-6 backdrop-blur-md shadow-2xl mt-2">
            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-ban text-pink-500 text-xl"></i>
                    <h3 class="text-xl md:text-2xl font-extrabold text-white">قائمة المكروف ليهم</h3>
                </div>
                <span id="itemCount" class="text-xs bg-pink-500/20 text-pink-300 px-3 py-1 rounded-full border border-pink-500/30 font-bold">0 عناصر</span>
            </div>

            <!-- Input Form -->
            <form id="addKarefForm" class="flex flex-col sm:flex-row gap-2 mb-4">
                <textarea 
                    id="karefInput" 
                    rows="2"
                    placeholder="اكتب هنا أي حاجة عاوز تكرفلها..." 
                    class="flex-1 bg-black/60 border border-slate-700 focus:border-pink-500 rounded-xl p-3 text-sm md:text-base outline-none text-white placeholder-gray-500 transition-all resize-none"
                    required
                ></textarea>
                <button 
                    type="submit" 
                    class="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold px-6 py-3 rounded-xl transition-all flex items-center justify-center gap-2 shrink-0 shadow-lg shadow-pink-600/30 self-stretch sm:self-auto active:scale-95"
                >
                    <span>أضف للقائمة</span>
                    <i class="fa-solid fa-plus text-xs"></i>
                </button>
            </form>

            <!-- Dynamic List Items Container -->
            <div id="karefList" class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                <!-- Dynamically populated via JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-gray-500 text-xs md:text-sm border-t border-white/10 mt-8 z-10">
        <p>© موقع <span class="text-pink-400 font-bold">كارف .com</span> | تصميم خاص ليامن ويوسف ⚡</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        /* Background Particle System */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.color = Math.random() > 0.5 ? '#ff007f' : '#00f0ff';
                this.alpha = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 40; i++) {
            particles.push(new Particle());
        }

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        /* Image Handlers with Fallback URLs */
        function handleYoussefImageError(imgElement) {
            const fallbacks = [
                "https://i.ibb.co/spSz6sWY/image.jpg",
                "https://i.ibb.co/spSz6sWY/youssef.jpg",
                "https://i.ibb.co/Ldv8D3v/youssef.jpg"
            ];
            const currentSrc = imgElement.src;
            for (let url of fallbacks) {
                if (currentSrc !== url) {
                    imgElement.src = url;
                    break;
                }
            }
        }

        function handleYamenImageError(imgElement) {
            const fallbacks = [
                "https://i.ibb.co/TB3pJSpZ/image.jpg",
                "https://i.ibb.co/TB3pJSpZ/yamen.jpg",
                "https://i.ibb.co/1fW5g3y/yamen.jpg"
            ];
            const currentSrc = imgElement.src;
            for (let url of fallbacks) {
                if (currentSrc !== url) {
                    imgElement.src = url;
                    break;
                }
            }
        }

        /* Web Audio API Sound Effects */
        function playCelebrationSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const audioCtx = new AudioContext();
                const notes = [
                    { freq: 523.25, time: 0.0, duration: 0.12 },
                    { freq: 659.25, time: 0.12, duration: 0.12 },
                    { freq: 783.99, time: 0.24, duration: 0.15 },
                    { freq: 1046.50, time: 0.40, duration: 0.35 }
                ];

                notes.forEach(note => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime + note.time);

                    gain.gain.setValueAtTime(0, audioCtx.currentTime + note.time);
                    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + note.time + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.time + note.duration);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(audioCtx.currentTime + note.time);
                    osc.stop(audioCtx.currentTime + note.time + note.duration);
                });
            } catch (err) {
                console.log('Audio error:', err);
            }
        }

        /* LocalStorage & List Management */
        let karefItems = JSON.parse(localStorage.getItem('karef_list_items')) || [];

        const karefForm = document.getElementById('addKarefForm');
        const karefInput = document.getElementById('karefInput');
        const karefList = document.getElementById('karefList');
        const itemCount = document.getElementById('itemCount');
        const celebrationToast = document.getElementById('celebrationToast');
        const karefItemName = document.getElementById('karefItemName');

        function saveAndRender() {
            localStorage.setItem('karef_list_items', JSON.stringify(karefItems));
            renderList();
        }

        function renderList() {
            karefList.innerHTML = '';
            itemCount.textContent = `${karefItems.length} عناصر`;

            if (karefItems.length === 0) {
                karefList.innerHTML = `
                    <div class="text-center py-8 text-gray-500 text-sm">
                        <i class="fa-solid fa-pen-to-square text-3xl mb-2 block text-slate-600"></i>
                        القائمة فاضية دلوقتي.. اكتب واضف أي حاجة ترفضها أو تكرفلها بسهولة!
                    </div>
                `;
                return;
            }

            karefItems.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bg-slate-900/80 border-r-4 border-pink-500 rounded-xl p-3.5 flex items-start justify-between gap-3 text-sm md:text-base font-semibold text-gray-200 hover:bg-slate-800 transition-colors shadow-md';
                itemDiv.innerHTML = `
                    <div class="flex items-start gap-3 w-full overflow-hidden">
                        <span class="text-pink-400 text-xs font-bold bg-pink-500/10 w-6 h-6 rounded-full flex items-center justify-center shrink-0 border border-pink-500/20 mt-0.5">${index + 1}</span>
                        <span class="break-words w-full whitespace-pre-line">${escapeHtml(item)}</span>
                    </div>
                    <button onclick="deleteItem(${index})" class="text-gray-500 hover:text-red-400 p-1.5 rounded-lg hover:bg-white/5 transition-colors shrink-0" title="مسح">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;
                karefList.appendChild(itemDiv);
            });
        }

        function deleteItem(index) {
            karefItems.splice(index, 1);
            saveAndRender();
        }

        /* Confetti Burst Animation */
        function launchCelebration() {
            const count = 200;
            const defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff007f', '#fbbf24', '#00f0ff'] });
            fire(0.2, { spread: 60, colors: ['#10b981', '#ec4899', '#f59e0b'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        }

        function showToast(text) {
            karefItemName.textContent = text;
            celebrationToast.classList.remove('opacity-0', 'pointer-events-none', 'scale-90');
            celebrationToast.classList.add('opacity-100', 'pointer-events-auto', 'scale-100');
        }

        function closeToast() {
            celebrationToast.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100');
            celebrationToast.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
        }

        karefForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = karefInput.value.trim();
            if (text) {
                karefItems.unshift(text);
                karefInput.value = '';
                saveAndRender();
                
                playCelebrationSound();
                launchCelebration();
                showToast(text);
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize List on Load
        window.onload = function() {
            renderList();
        };
    </script>
</body>
</html>
